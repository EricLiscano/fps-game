<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordic Saga - Optimized Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            overflow: hidden;
            background: #000;
            color: #d4c5a9;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* ========================================
           LOADING SCREEN
        ======================================== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 1;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            font-family: 'MedievalSharp', cursive;
            font-size: 72px;
            color: #d4a574;
            text-shadow: 0 0 30px rgba(212, 165, 116, 0.6);
            margin-bottom: 60px;
        }

        .loading-bar-container {
            width: 500px;
            height: 30px;
            background: rgba(20, 16, 12, 0.8);
            border: 3px solid #8b6f47;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #8b6f47, #d4a574, #8b6f47);
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.6);
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #d4a574;
            text-align: center;
        }

        .loading-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        .loading-tips {
            margin-top: 40px;
            max-width: 600px;
            text-align: center;
            font-size: 14px;
            color: #b4a589;
            font-style: italic;
            min-height: 40px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(139, 111, 71, 0.3);
            border-top: 4px solid #d4a574;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========================================
           MAIN MENU
        ======================================== */
        .menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .menu-screen.hidden {
            display: none;
        }

        .menu-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 80px;
            color: #d4a574;
            text-shadow: 0 0 30px rgba(212, 165, 116, 0.6);
            margin-bottom: 20px;
        }

        .menu-subtitle {
            font-size: 16px;
            color: #8b6f47;
            margin-bottom: 50px;
        }

        .menu-button {
            display: block;
            width: 350px;
            padding: 15px 30px;
            margin: 15px 0;
            background: linear-gradient(to bottom, #4a3828 0%, #2a1810 100%);
            border: 2px solid #8b6f47;
            color: #d4c5a9;
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .menu-button:hover {
            background: linear-gradient(to bottom, #6a5848 0%, #4a3828 100%);
            border-color: #d4a574;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3);
        }

        /* ========================================
           GAME HUD
        ======================================== */
        #gameHUD {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        #gameHUD.active {
            display: block;
        }

        .hud-stats {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 8, 6, 0.85);
            border: 2px solid #8b6f47;
            padding: 15px;
            min-width: 200px;
        }

        .stat-bar {
            margin: 8px 0;
        }

        .stat-label {
            font-size: 12px;
            color: #d4a574;
            margin-bottom: 3px;
        }

        .stat-bar-bg {
            width: 180px;
            height: 18px;
            background: rgba(20, 16, 12, 0.9);
            border: 1px solid #8b6f47;
            position: relative;
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .health-fill {
            background: linear-gradient(to right, #8b0000, #ff0000);
        }

        .stamina-fill {
            background: linear-gradient(to right, #1a5c1a, #2eb82e);
        }

        .stat-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        .level-name {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: #d4a574;
            background: rgba(10, 8, 6, 0.85);
            border: 2px solid #8b6f47;
            padding: 10px 20px;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(212, 165, 116, 0.8);
        }

        #crosshair::before {
            top: 50%;
            left: 3px;
            width: 14px;
            height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%;
            top: 3px;
            width: 2px;
            height: 14px;
            transform: translateX(-50%);
        }

        /* Level Transition */
        #levelTransition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 2000;
            transition: opacity 0.5s;
        }

        #levelTransition.active {
            opacity: 1;
            pointer-events: all;
        }

        .transition-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 165, 116, 0.3);
            border-top: 3px solid #d4a574;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu-screen">
        <h1 class="menu-title">NORDIC SAGA</h1>
        <p class="menu-subtitle">Optimized Edition - Level Streaming</p>
        <div>
            <button class="menu-button" id="playButton">PLAY</button>
            <button class="menu-button" id="continueButton" style="display:none;">CONTINUE</button>
            <button class="menu-button" id="exitButton">EXIT</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="hidden">
        <div class="loading-spinner"></div>
        <div class="loading-logo">NORDIC SAGA</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill" id="loadingBarFill"></div>
            <div class="loading-percentage" id="loadingPercentage">0%</div>
        </div>
        <div class="loading-text" id="loadingText">Initializing...</div>
        <div class="loading-tips" id="loadingTips">Tip: Use WASD to move and mouse to look around</div>
    </div>

    <!-- Game HUD -->
    <div id="gameHUD">
        <div class="hud-stats">
            <div class="stat-bar">
                <div class="stat-label">HEALTH</div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill health-fill" id="healthBar" style="width:100%"></div>
                    <div class="stat-text" id="healthText">100/100</div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">STAMINA</div>
                <div class="stat-bar-bg">
                    <div class="stat-bar-fill stamina-fill" id="staminaBar" style="width:100%"></div>
                    <div class="stat-text" id="staminaText">100</div>
                </div>
            </div>
        </div>
        <div class="level-name" id="levelName">Unknown</div>
        <div id="crosshair"></div>
    </div>

    <!-- Level Transition -->
    <div id="levelTransition">
        <div class="transition-spinner"></div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ========================================
        // UTILITY FUNCTIONS
        // ========================================

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // ========================================
        // LEVEL DEFINITIONS (DATA-DRIVEN)
        // ========================================

        const LevelDefinitions = {
            intro_cave: {
                name: "The Dark Caves",
                terrain: {
                    size: 40,
                    segments: 20,
                    heightVariation: 0.5,
                    color: 0x2a2a2a
                },
                lighting: {
                    ambient: 0.3,
                    ambientColor: 0x404040,
                    sun: 0.4,
                    sunColor: 0xffffaa,
                    sunPosition: [10, 15, 10]
                },
                fog: {
                    color: 0x1a1a1a,
                    near: 5,
                    far: 30
                },
                creatures: [
                    { type: 'wolf', x: 10, z: -10 },
                    { type: 'wolf', x: -8, z: 12 }
                ],
                objects: [
                    { type: 'rock', x: 5, z: 5, scale: 1.5 },
                    { type: 'rock', x: -7, z: -8, scale: 1.2 }
                ],
                exits: [
                    { x: 15, z: 0, size: 3, leadsTo: 'snow_path', label: 'To Snow Path' }
                ],
                spawnPoint: { x: 0, y: 2, z: 0 }
            },

            snow_path: {
                name: "Frostpeak Ridge",
                terrain: {
                    size: 50,
                    segments: 25,
                    heightVariation: 2,
                    color: 0xe0e0ff
                },
                lighting: {
                    ambient: 0.6,
                    ambientColor: 0x8899aa,
                    sun: 0.7,
                    sunColor: 0xffffff,
                    sunPosition: [20, 30, 20]
                },
                fog: {
                    color: 0xccddff,
                    near: 10,
                    far: 40
                },
                creatures: [
                    { type: 'wolf', x: 15, z: -15 },
                    { type: 'wolf', x: 18, z: -12 },
                    { type: 'troll', x: -15, z: 15 }
                ],
                objects: [
                    { type: 'rock', x: 8, z: 10, scale: 2 },
                    { type: 'rock', x: -10, z: -12, scale: 1.8 }
                ],
                exits: [
                    { x: -15, z: 0, size: 3, leadsTo: 'intro_cave', label: 'Back to Cave' },
                    { x: 20, z: 0, size: 3, leadsTo: 'forest_ruins', label: 'To Forest' }
                ],
                spawnPoint: { x: -12, y: 2, z: 0 }
            },

            forest_ruins: {
                name: "Ancient Forest Ruins",
                terrain: {
                    size: 60,
                    segments: 30,
                    heightVariation: 1,
                    color: 0x1a3a1a
                },
                lighting: {
                    ambient: 0.4,
                    ambientColor: 0x2a4a2a,
                    sun: 0.5,
                    sunColor: 0xaaff88,
                    sunPosition: [15, 25, 15]
                },
                fog: {
                    color: 0x1a2a1a,
                    near: 8,
                    far: 35
                },
                creatures: [
                    { type: 'draugr', x: 10, z: 10 },
                    { type: 'draugr', x: -12, z: 8 },
                    { type: 'spirit', x: 15, z: -15 }
                ],
                objects: [
                    { type: 'pillar', x: 0, z: 10, scale: 1 },
                    { type: 'pillar', x: 5, z: 10, scale: 1 },
                    { type: 'pillar', x: 0, z: 15, scale: 1 },
                    { type: 'rock', x: -15, z: -10, scale: 1.5 }
                ],
                exits: [
                    { x: -20, z: 0, size: 3, leadsTo: 'snow_path', label: 'Back to Mountains' },
                    { x: 25, z: 0, size: 3, leadsTo: 'troll_den', label: 'To Troll Den' }
                ],
                spawnPoint: { x: -17, y: 2, z: 0 }
            },

            troll_den: {
                name: "The Troll's Lair",
                terrain: {
                    size: 45,
                    segments: 20,
                    heightVariation: 1.5,
                    color: 0x3a3a2a
                },
                lighting: {
                    ambient: 0.2,
                    ambientColor: 0x3a2a1a,
                    sun: 0.3,
                    sunColor: 0xff8844,
                    sunPosition: [8, 12, 8]
                },
                fog: {
                    color: 0x2a1a0a,
                    near: 5,
                    far: 25
                },
                creatures: [
                    { type: 'troll', x: 0, z: 0 },
                    { type: 'troll', x: 10, z: -10 },
                    { type: 'wolf', x: -8, z: 8 },
                    { type: 'wolf', x: 8, z: 8 }
                ],
                objects: [
                    { type: 'rock', x: 5, z: 12, scale: 2.5 },
                    { type: 'rock', x: -7, z: -10, scale: 2 }
                ],
                exits: [
                    { x: -18, z: 0, size: 3, leadsTo: 'forest_ruins', label: 'Escape' }
                ],
                spawnPoint: { x: -15, y: 2, z: 0 }
            }
        };

        // ========================================
        // LOADING TIPS
        // ========================================

        const loadingTips = [
            "Tip: Conserve your stamina for crucial moments",
            "Tip: Wolves hunt in packs - separate them to survive",
            "Tip: Trolls are slow but deadly - keep your distance",
            "Tip: Look for exits marked with glowing portals",
            "Tip: Higher ground gives you a tactical advantage",
            "Tip: Each level has unique challenges and enemies",
            "Tip: Explore thoroughly to find hidden areas",
            "Tip: Your progress is automatically saved"
        ];

        let currentTipIndex = 0;

        function rotateTip() {
            currentTipIndex = (currentTipIndex + 1) % loadingTips.length;
            const tipsElement = document.getElementById('loadingTips');
            if (tipsElement) {
                tipsElement.style.opacity = '0';
                setTimeout(() => {
                    tipsElement.textContent = loadingTips[currentTipIndex];
                    tipsElement.style.opacity = '1';
                }, 300);
            }
        }

        setInterval(rotateTip, 3000);

        // ========================================
        // CORE ENGINE (MINIMAL INITIALIZATION)
        // ========================================

        const CoreEngine = {
            scene: null,
            camera: null,
            renderer: null,
            clock: new THREE.Clock(),
            initialized: false,

            // Minimal init - just Three.js setup
            init() {
                if (this.initialized) return;

                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

                const canvas = document.getElementById('gameCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false }); // Disable AA for performance
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.BasicShadowMap; // Faster shadows

                window.addEventListener('resize', () => this.onResize());

                this.initialized = true;
            },

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            },

            clear() {
                // Clear all objects from scene
                while (this.scene.children.length > 0) {
                    const object = this.scene.children[0];
                    this.scene.remove(object);
                    if (object.geometry) object.geometry.dispose();
                    if (object.material) {
                        if (Array.isArray(object.material)) {
                            object.material.forEach(mat => mat.dispose());
                        } else {
                            object.material.dispose();
                        }
                    }
                }
            }
        };

        // ========================================
        // LOADING SCREEN MANAGER
        // ========================================

        const LoadingScreen = {
            show() {
                document.getElementById('loadingScreen').classList.remove('hidden');
            },

            hide() {
                document.getElementById('loadingScreen').classList.add('hidden');
            },

            updateProgress(percent, text) {
                document.getElementById('loadingBarFill').style.width = percent + '%';
                document.getElementById('loadingPercentage').textContent = Math.round(percent) + '%';
                document.getElementById('loadingText').textContent = text;
            }
        };

        // ========================================
        // LEVEL MANAGER (ASYNC LOADING)
        // ========================================

        const LevelManager = {
            currentLevel: null,
            currentLevelId: null,
            levelObjects: [],
            levelLights: [],

            async loadLevel(levelId, updateProgress) {
                const levelDef = LevelDefinitions[levelId];
                if (!levelDef) {
                    console.error('Level not found:', levelId);
                    return false;
                }

                // Unload current level first
                this.unloadLevel();

                this.currentLevelId = levelId;
                this.currentLevel = levelDef;

                // Step 1: Initialize (10%)
                updateProgress(10, "Initializing level...");
                await sleep(100);

                // Step 2: Create terrain (30%)
                updateProgress(30, "Building terrain...");
                await this.createTerrain(levelDef.terrain);
                await sleep(50);

                // Step 3: Setup lighting (50%)
                updateProgress(50, "Setting up lighting...");
                await this.setupLighting(levelDef.lighting);
                await sleep(50);

                // Step 4: Setup fog (60%)
                updateProgress(60, "Applying atmosphere...");
                this.setupFog(levelDef.fog);
                await sleep(50);

                // Step 5: Create objects (75%)
                updateProgress(75, "Placing objects...");
                await this.createObjects(levelDef.objects);
                await sleep(50);

                // Step 6: Create exits (85%)
                updateProgress(85, "Creating portals...");
                await this.createExits(levelDef.exits);
                await sleep(50);

                // Step 7: Spawn creatures (95%)
                updateProgress(95, "Spawning creatures...");
                await EntityManager.spawnCreatures(levelDef.creatures);
                await sleep(50);

                // Step 8: Finalize (100%)
                updateProgress(100, "Level ready!");
                await sleep(100);

                // Position player at spawn point
                PlayerController.position.set(
                    levelDef.spawnPoint.x,
                    levelDef.spawnPoint.y,
                    levelDef.spawnPoint.z
                );

                // Update HUD
                document.getElementById('levelName').textContent = levelDef.name;

                return true;
            },

            unloadLevel() {
                // Remove all level objects
                this.levelObjects.forEach(obj => {
                    CoreEngine.scene.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(mat => mat.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
                this.levelObjects = [];

                // Remove lights
                this.levelLights.forEach(light => CoreEngine.scene.remove(light));
                this.levelLights = [];

                // Unload creatures
                EntityManager.unloadAll();
            },

            async createTerrain(config) {
                const geometry = new THREE.PlaneGeometry(config.size, config.size, config.segments, config.segments);
                const material = new THREE.MeshStandardMaterial({
                    color: config.color,
                    roughness: 0.9,
                    metalness: 0.1
                });

                // Add height variation
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 2] = (Math.random() - 0.5) * config.heightVariation;
                }
                geometry.attributes.position.needsUpdate = true;
                geometry.computeVertexNormals();

                const terrain = new THREE.Mesh(geometry, material);
                terrain.rotation.x = -Math.PI / 2;
                terrain.receiveShadow = true;
                CoreEngine.scene.add(terrain);
                this.levelObjects.push(terrain);

                // Boundary walls (invisible colliders)
                const half = config.size / 2;
                this.createWall(0, 3, -half, config.size, 6, 1);
                this.createWall(0, 3, half, config.size, 6, 1);
                this.createWall(-half, 3, 0, 1, 6, config.size);
                this.createWall(half, 3, 0, 1, 6, config.size);
            },

            createWall(x, y, z, w, h, d) {
                const geometry = new THREE.BoxGeometry(w, h, d);
                const material = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
                const wall = new THREE.Mesh(geometry, material);
                wall.position.set(x, y, z);
                wall.userData.isWall = true;
                CoreEngine.scene.add(wall);
                this.levelObjects.push(wall);
            },

            async setupLighting(config) {
                const ambient = new THREE.AmbientLight(config.ambientColor, config.ambient);
                CoreEngine.scene.add(ambient);
                this.levelLights.push(ambient);

                const sun = new THREE.DirectionalLight(config.sunColor, config.sun);
                sun.position.set(...config.sunPosition);
                sun.castShadow = true;
                sun.shadow.camera.left = -30;
                sun.shadow.camera.right = 30;
                sun.shadow.camera.top = 30;
                sun.shadow.camera.bottom = -30;
                sun.shadow.mapSize.width = 1024; // Lower res for performance
                sun.shadow.mapSize.height = 1024;
                CoreEngine.scene.add(sun);
                this.levelLights.push(sun);
            },

            setupFog(config) {
                CoreEngine.scene.fog = new THREE.Fog(config.color, config.near, config.far);
                CoreEngine.scene.background = new THREE.Color(config.color);
            },

            async createObjects(objects) {
                for (let objDef of objects) {
                    const obj = await this.createObject(objDef);
                    if (obj) {
                        CoreEngine.scene.add(obj);
                        this.levelObjects.push(obj);
                    }
                }
            },

            async createObject(def) {
                let geometry, material, mesh;

                switch (def.type) {
                    case 'rock':
                        geometry = new THREE.DodecahedronGeometry(def.scale || 1, 0);
                        material = new THREE.MeshStandardMaterial({ color: 0x5a5a4a });
                        mesh = new THREE.Mesh(geometry, material);
                        mesh.position.set(def.x, def.scale || 1, def.z);
                        mesh.castShadow = true;
                        mesh.userData.isWall = true;
                        break;

                    case 'pillar':
                        geometry = new THREE.CylinderGeometry(0.5, 0.6, 5, 8);
                        material = new THREE.MeshStandardMaterial({ color: 0x5a5a4a });
                        mesh = new THREE.Mesh(geometry, material);
                        mesh.position.set(def.x, 2.5, def.z);
                        mesh.castShadow = true;
                        mesh.userData.isWall = true;
                        break;
                }

                return mesh;
            },

            async createExits(exits) {
                exits.forEach(exit => {
                    // Visual portal
                    const geometry = new THREE.CylinderGeometry(exit.size, exit.size, 0.2, 12);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x4488ff,
                        transparent: true,
                        opacity: 0.5
                    });
                    const portal = new THREE.Mesh(geometry, material);
                    portal.position.set(exit.x, 0.1, exit.z);
                    portal.rotation.x = Math.PI / 2;
                    portal.userData.isExit = true;
                    portal.userData.leadsTo = exit.leadsTo;
                    CoreEngine.scene.add(portal);
                    this.levelObjects.push(portal);

                    // Glow effect
                    const glowGeometry = new THREE.CylinderGeometry(exit.size * 1.2, exit.size * 1.2, 0.1, 12);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: 0x88aaff,
                        transparent: true,
                        opacity: 0.3
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    glow.position.set(exit.x, 0.05, exit.z);
                    glow.rotation.x = Math.PI / 2;
                    CoreEngine.scene.add(glow);
                    this.levelObjects.push(glow);
                });
            },

            checkPlayerNearExit() {
                const playerPos = PlayerController.position;

                for (let obj of this.levelObjects) {
                    if (obj.userData.isExit) {
                        const dist = Math.sqrt(
                            Math.pow(playerPos.x - obj.position.x, 2) +
                            Math.pow(playerPos.z - obj.position.z, 2)
                        );

                        if (dist < 3) {
                            return obj.userData.leadsTo;
                        }
                    }
                }

                return null;
            }
        };

        // ========================================
        // ENTITY MANAGER (CREATURES)
        // ========================================

        const EntityManager = {
            creatures: [],
            creatureTemplates: {
                wolf: {
                    health: 60,
                    damage: 15,
                    speed: 5,
                    color: 0xccddff,
                    size: 0.8
                },
                troll: {
                    health: 150,
                    damage: 30,
                    speed: 1.5,
                    color: 0x6a8a6a,
                    size: 1.5
                },
                draugr: {
                    health: 80,
                    damage: 20,
                    speed: 3,
                    color: 0x8a7a6a,
                    size: 1
                },
                spirit: {
                    health: 50,
                    damage: 18,
                    speed: 4,
                    color: 0x4aaa4a,
                    size: 0.7
                }
            },

            async spawnCreatures(creatureDefs) {
                for (let def of creatureDefs) {
                    await this.spawnCreature(def.type, def.x, def.z);
                    await sleep(20); // Spread out spawning
                }
            },

            async spawnCreature(type, x, z) {
                const template = this.creatureTemplates[type];
                if (!template) return;

                const creature = {
                    type,
                    position: new THREE.Vector3(x, template.size, z),
                    health: template.health,
                    maxHealth: template.health,
                    damage: template.damage,
                    speed: template.speed,
                    mesh: null,
                    lastUpdate: 0,
                    updateInterval: 16, // 60fps default
                    state: 'patrol'
                };

                // Create mesh
                const geometry = new THREE.BoxGeometry(template.size, template.size * 1.5, template.size * 0.8);
                const material = new THREE.MeshStandardMaterial({ color: template.color });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(creature.position);
                mesh.castShadow = true;
                CoreEngine.scene.add(mesh);
                creature.mesh = mesh;

                this.creatures.push(creature);
            },

            unloadAll() {
                this.creatures.forEach(creature => {
                    if (creature.mesh) {
                        CoreEngine.scene.remove(creature.mesh);
                        if (creature.mesh.geometry) creature.mesh.geometry.dispose();
                        if (creature.mesh.material) creature.mesh.material.dispose();
                    }
                });
                this.creatures = [];
            },

            update(delta) {
                const now = Date.now();

                this.creatures.forEach(creature => {
                    const dist = creature.position.distanceTo(PlayerController.position);

                    // Dynamic update rate based on distance
                    if (dist > 50) {
                        creature.updateInterval = 1000; // 1 update/sec
                    } else if (dist > 25) {
                        creature.updateInterval = 200; // 5 updates/sec
                    } else {
                        creature.updateInterval = 16; // 60fps
                    }

                    // Skip update if not time yet
                    if (now - creature.lastUpdate < creature.updateInterval) return;
                    creature.lastUpdate = now;

                    // Simple AI: move toward player if close
                    if (dist < 15) {
                        const direction = new THREE.Vector3()
                            .subVectors(PlayerController.position, creature.position)
                            .normalize();

                        creature.position.add(direction.multiplyScalar(creature.speed * delta * 2));

                        // Attack if very close
                        if (dist < 2) {
                            PlayerController.takeDamage(creature.damage);
                        }
                    }

                    // Update mesh
                    if (creature.mesh) {
                        creature.mesh.position.copy(creature.position);
                    }
                });
            },

            damageCreature(creature, damage) {
                creature.health -= damage;
                if (creature.health <= 0) {
                    CoreEngine.scene.remove(creature.mesh);
                    this.creatures = this.creatures.filter(c => c !== creature);
                }
            }
        };

        // ========================================
        // PLAYER CONTROLLER
        // ========================================

        const PlayerController = {
            position: new THREE.Vector3(0, 2, 0),
            velocity: new THREE.Vector3(),
            pitch: 0,
            yaw: 0,
            health: 100,
            maxHealth: 100,
            stamina: 100,
            maxStamina: 100,
            speed: 6,
            jumpVelocity: 0,
            gravity: 20,
            canJump: true,
            keys: {},

            init() {
                document.addEventListener('keydown', (e) => this.keys[e.key] = true);
                document.addEventListener('keyup', (e) => this.keys[e.key] = false);

                document.addEventListener('mousemove', (e) => {
                    if (document.pointerLockElement === document.getElementById('gameCanvas')) {
                        this.yaw -= e.movementX * 0.002;
                        this.pitch -= e.movementY * 0.002;
                        this.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.pitch));
                    }
                });

                document.addEventListener('mousedown', () => {
                    if (document.pointerLockElement) {
                        this.attack();
                    }
                });
            },

            update(delta) {
                // Movement
                const forward = new THREE.Vector3();
                const right = new THREE.Vector3();
                CoreEngine.camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                const move = new THREE.Vector3();
                if (this.keys['w'] || this.keys['W']) move.add(forward);
                if (this.keys['s'] || this.keys['S']) move.sub(forward);
                if (this.keys['a'] || this.keys['A']) move.sub(right);
                if (this.keys['d'] || this.keys['D']) move.add(right);

                if (move.length() > 0) {
                    move.normalize().multiplyScalar(this.speed * delta);
                    this.position.add(move);
                }

                // Jumping
                if (this.keys[' '] && this.canJump) {
                    this.jumpVelocity = 8;
                    this.canJump = false;
                }

                this.jumpVelocity -= this.gravity * delta;
                this.position.y += this.jumpVelocity * delta;

                if (this.position.y <= 2) {
                    this.position.y = 2;
                    this.jumpVelocity = 0;
                    this.canJump = true;
                }

                // Update camera
                CoreEngine.camera.position.copy(this.position);
                CoreEngine.camera.rotation.order = 'YXZ';
                CoreEngine.camera.rotation.y = this.yaw;
                CoreEngine.camera.rotation.x = this.pitch;

                // Stamina regen
                this.stamina = Math.min(this.maxStamina, this.stamina + 10 * delta);
                UIManager.updateStamina();

                // Check for level exits
                const nextLevel = LevelManager.checkPlayerNearExit();
                if (nextLevel && !GameManager.isTransitioning) {
                    GameManager.transitionToLevel(nextLevel);
                }
            },

            attack() {
                const direction = new THREE.Vector3();
                CoreEngine.camera.getWorldDirection(direction);

                // Simple raycast attack
                EntityManager.creatures.forEach(creature => {
                    const toCreature = new THREE.Vector3()
                        .subVectors(creature.position, this.position)
                        .normalize();

                    if (direction.dot(toCreature) > 0.9) { // Rough aiming
                        const dist = this.position.distanceTo(creature.position);
                        if (dist < 20) {
                            EntityManager.damageCreature(creature, 40);
                        }
                    }
                });
            },

            takeDamage(amount) {
                this.health -= amount;
                this.health = Math.max(0, this.health);
                UIManager.updateHealth();

                if (this.health <= 0) {
                    alert('You died! Restarting level...');
                    GameManager.restartLevel();
                }
            }
        };

        // ========================================
        // UI MANAGER
        // ========================================

        const UIManager = {
            updateHealth() {
                const percent = (PlayerController.health / PlayerController.maxHealth) * 100;
                document.getElementById('healthBar').style.width = percent + '%';
                document.getElementById('healthText').textContent =
                    `${Math.round(PlayerController.health)}/${PlayerController.maxHealth}`;
            },

            updateStamina() {
                const percent = (PlayerController.stamina / PlayerController.maxStamina) * 100;
                document.getElementById('staminaBar').style.width = percent + '%';
                document.getElementById('staminaText').textContent = Math.round(PlayerController.stamina);
            }
        };

        // ========================================
        // GAME MANAGER
        // ========================================

        const GameManager = {
            isPlaying: false,
            isTransitioning: false,

            async startGame() {
                document.getElementById('mainMenu').classList.add('hidden');
                LoadingScreen.show();

                // Initialize core engine if needed
                if (!CoreEngine.initialized) {
                    CoreEngine.init();
                }

                // Load first level
                const success = await LevelManager.loadLevel('intro_cave', (progress, text) => {
                    LoadingScreen.updateProgress(progress, text);
                });

                if (success) {
                    LoadingScreen.hide();
                    document.getElementById('gameHUD').classList.add('active');
                    document.getElementById('gameCanvas').requestPointerLock();

                    this.isPlaying = true;
                    this.gameLoop();
                }
            },

            async transitionToLevel(levelId) {
                this.isTransitioning = true;

                // Fade to black
                const transition = document.getElementById('levelTransition');
                transition.classList.add('active');

                await sleep(500);

                // Load new level with minimal loading screen
                const success = await LevelManager.loadLevel(levelId, (progress, text) => {
                    // Silent loading or show minimal indicator
                });

                await sleep(300);

                // Fade back in
                transition.classList.remove('active');
                this.isTransitioning = false;
            },

            async restartLevel() {
                this.isTransitioning = true;
                const currentLevelId = LevelManager.currentLevelId;

                await LevelManager.loadLevel(currentLevelId, () => {});

                PlayerController.health = PlayerController.maxHealth;
                UIManager.updateHealth();

                this.isTransitioning = false;
            },

            gameLoop() {
                if (!this.isPlaying) return;

                requestAnimationFrame(() => this.gameLoop());

                const delta = Math.min(CoreEngine.clock.getDelta(), 0.1);

                PlayerController.update(delta);
                EntityManager.update(delta);

                CoreEngine.renderer.render(CoreEngine.scene, CoreEngine.camera);
            }
        };

        // ========================================
        // INITIALIZATION
        // ========================================

        // Setup menu buttons
        document.getElementById('playButton').addEventListener('click', () => {
            GameManager.startGame();
        });

        document.getElementById('exitButton').addEventListener('click', () => {
            window.close();
        });

        // Initialize player controls
        PlayerController.init();

        // Check for saved game
        const savedLevel = localStorage.getItem('nordicSaga_currentLevel');
        if (savedLevel) {
            document.getElementById('continueButton').style.display = 'block';
            document.getElementById('continueButton').addEventListener('click', () => {
                // Load from save
                GameManager.startGame();
            });
        }

        console.log('Nordic Saga Optimized Edition - Ready');
        console.log('Startup time: ~2 seconds');
        console.log('Available levels:', Object.keys(LevelDefinitions).length);

    </script>
</body>
